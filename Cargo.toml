[package]
name = "packarch-depannage"
version = "0.3.3"
edition = "2024"
description = "Temporary remote help (Tailscale SSH) for Packarch"
license = "GPL-3.0-or-later"
repository = "https://github.com/packarch/packarch-depannage"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
